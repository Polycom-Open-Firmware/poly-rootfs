# Kiosk compositor config, shared by every board. kiosk-shell fullscreens
# the single client (the browser or Kodi launched by kiosk-launch).
# mode=current: inherit the mode the kernel console already set instead of
# re-modesetting — the C60's rm67191 panel drops its DSI link on a weston
# modeset (bring-up-grade driver), and inheriting is harmless on the TC8.
# transform is per-board (TC8 panel is mounted landscape, the C60 portrait);
# kiosk-launch rewrites it from the device-tree model at startup.
[core]
shell=kiosk-shell.so
require-input=false
idle-time=0
xwayland=false

[output]
name=DSI-1
mode=current
transform=rotate-90

[libinput]
enable-tap=true
